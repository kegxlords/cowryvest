<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Financial Requests | Cowryvest</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="container page-container">
    <div class="page-hero">
      <div>
        <h1>Deposit & Withdrawal Requests</h1>
        <p>Verify manual transfers and process withdrawals.</p>
      </div>
      <span class="chip frozen">Verification Desk</span>
    </div>

    <nav class="admin-subnav">
      <a href="/admin/index.html">Overview</a>
      <a href="/admin/stocks.html">Stocks</a>
      <a href="/admin/promoters.html">Promoters</a>
      <a href="/admin/requests.html" class="active">Requests</a>
    </nav>

    <div id="adminAlert" class="alert error"></div>

    <section class="section-card" style="margin-bottom: 16px;">
      <div class="section-head">
        <h2>Filters</h2>
      </div>

      <div class="admin-toolbar">
        <div class="form-group">
          <label for="typeFilter">Type</label>
          <select id="typeFilter" class="form-control">
            <option value="all">All Types</option>
            <option value="deposit">Deposits</option>
            <option value="withdrawal">Withdrawals</option>
          </select>
        </div>

        <div class="form-group">
          <label for="statusFilter">Status</label>
          <select id="statusFilter" class="form-control">
            <option value="pending" selected>Pending</option>
            <option value="all">All Statuses</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>

        <button class="btn btn-primary" id="applyFilters">Apply</button>
      </div>
    </section>

    <section class="section-card">
      <div class="section-head">
        <h2>Requests</h2>
        <span id="countLabel" style="color: var(--text-muted); font-size: .85rem; font-weight: 700;"></span>
      </div>

      <div id="requestsList" class="req-list">
        <div class="mini-empty">Loading requests...</div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module">
    import { initAdminUI } from '/lib/ui.js';
    import { supabase } from '/lib/supabase.js';
    import { formatMoney } from '/lib/format.js';

    await initAdminUI();

    const alertBox = document.getElementById('adminAlert');

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function statusBadge(status) {
      return `<span class="status-badge status-${status}">${status}</span>`;
    }

    function getInitials(name) {
      return String(name || 'U')
        .trim()
        .split(' ')
        .map(p => p[0])
        .slice(0, 2)
        .join('')
        .toUpperCase();
    }

    function getRequestDetails(r) {
      if (r.type === 'deposit') {
        const name = r.depositor_name || r.destination_details?.depositor_name || '-';
        return `Method: ${escapeHtml(r.payment_method || '-')} • Name on deposit: <strong>${escapeHtml(name)}</strong>`;
      }

      const d = r.destination_details || {};
      return `
        Method: ${escapeHtml(d.payment_method || r.payment_method || '-')} •
        Account: ${escapeHtml(d.account_name || '-')} •
        Number/Wallet: ${escapeHtml(d.account_number || '-')}
        ${d.bank_name ? `• ${escapeHtml(d.bank_name)}` : ''}
      `;
    }

    async function apiGet(action) {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) throw new Error('Not authenticated.');

      const res = await fetch(`/api/admin?action=${action}`, {
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });

      const result = await res.json();
      if (!res.ok) throw new Error(result.error || 'Request failed.');
      return result;
    }

    async function apiPost(payload) {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) throw new Error('Not authenticated.');

      const res = await fetch('/api/admin', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify(payload)
      });

      const result = await res.json();
      if (!res.ok) throw new Error(result.error || 'Request failed.');
      return result;
    }

    async function loadRequests() {
      hideAlert();

      const type = document.getElementById('typeFilter').value;
      const status = document.getElementById('statusFilter').value;
      const list = document.getElementById('requestsList');

      list.innerHTML = '<div class="mini-empty">Loading requests...</div>';

      try {
        const result = await apiGet(`requests&type=${type}&status=${status}`);
        const requests = result.requests || [];

        document.getElementById('countLabel').textContent =
          `${requests.length} record${requests.length === 1 ? '' : 's'}`;

        if (requests.length === 0) {
          list.innerHTML = '<div class="mini-empty">No requests match these filters.</div>';
          return;
        }

        list.innerHTML = requests.map(r => {
          const isDeposit = r.type === 'deposit';
          const sign = isDeposit ? '+' : '-';
          const amountClass = isDeposit ? 'credit' : 'debit';

          const actions = r.status === 'pending'
            ? `
              <button class="btn btn-success" data-approve="${r.id}">Approve</button>
              <button class="btn btn-warning" data-reject="${r.id}">Reject</button>
            `
            : `<span class="processed">Processed${r.admin_note ? ` • ${escapeHtml(r.admin_note)}` : ''}</span>`;

          return `
            <div class="req-card">
              <div class="req-user">
                <div class="hist-icon ${amountClass}">
                  <span style="font-weight: 900; font-size: .8rem;">
                    ${escapeHtml(getInitials(r.profiles?.full_name))}
                  </span>
                </div>
                <div style="min-width: 0;">
                  <div class="title">
                    ${escapeHtml(r.profiles?.full_name || 'User')}
                    <span class="badge ${isDeposit ? 'badge-main' : 'badge-frozen'}">
                      ${isDeposit ? 'Deposit' : 'Withdrawal'}
                    </span>
                  </div>
                  <div class="req-meta">
                    ${escapeHtml(r.profiles?.email || '')}<br />
                    ${getRequestDetails(r)}<br />
                    ${new Date(r.created_at).toLocaleString()}
                  </div>
                </div>
              </div>

              <div class="req-amount">
                <div class="amt ${amountClass}">${sign}${formatMoney(r.amount)}</div>
                <div style="margin-top: 6px;">${statusBadge(r.status)}</div>
              </div>

              <div class="req-actions">${actions}</div>
            </div>
          `;
        }).join('');

        document.querySelectorAll('[data-approve]').forEach(btn => {
          btn.addEventListener('click', () => handleRequest(btn.dataset.approve, 'approve'));
        });

        document.querySelectorAll('[data-reject]').forEach(btn => {
          btn.addEventListener('click', () => handleRequest(btn.dataset.reject, 'reject'));
        });
      } catch (err) {
        list.innerHTML = `<div class="mini-empty">${escapeHtml(err.message)}</div>`;
      }
    }

    async function handleRequest(requestId, decision) {
      hideAlert();

      const note = prompt(`Optional admin note for ${decision}:`) || '';

      try {
        await apiPost({
          action: decision === 'approve' ? 'approve_financial_request' : 'reject_financial_request',
          request_id: requestId,
          admin_note: note
        });

        showAlert(
          decision === 'approve'
            ? 'Request approved successfully.'
            : 'Request rejected successfully.',
          'success'
        );

        await loadRequests();
      } catch (err) {
        showAlert(err.message);
      }
    }

    document.getElementById('applyFilters').addEventListener('click', loadRequests);

    await loadRequests();
  </script>
</body>
</html>
