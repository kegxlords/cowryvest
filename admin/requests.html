<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Financial Requests | Cowryvest</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="container" style="margin-top: 30px;">
    <div class="page-header">
      <div>
        <h1>Deposit & Withdrawal Requests</h1>
        <p>Approve or reject user financial requests.</p>
      </div>
    </div>

    <nav class="admin-subnav">
      <a href="/admin/index.html">Overview</a>
      <a href="/admin/stocks.html">Stocks</a>
      <a href="/admin/promoters.html">Promoters</a>
      <a href="/admin/requests.html" class="active">Requests</a>
    </nav>

    <div id="adminAlert" class="alert error"></div>

    <section class="admin-panel">
      <h2>Filters</h2>

      <div class="admin-toolbar">
        <div class="form-group">
          <label for="typeFilter">Type</label>
          <select id="typeFilter" class="form-control">
            <option value="all">All Types</option>
            <option value="deposit">Deposits</option>
            <option value="withdrawal">Withdrawals</option>
          </select>
        </div>

        <div class="form-group">
          <label for="statusFilter">Status</label>
          <select id="statusFilter" class="form-control">
            <option value="all">All Statuses</option>
            <option value="pending" selected>Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>

        <button class="btn btn-primary" onclick="loadRequests()">Apply Filters</button>
      </div>
    </section>

    <section class="admin-panel">
      <h2>Requests</h2>

      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>User</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Details</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="requestsBody">
            <tr>
              <td colspan="7" class="loading-text">Loading requests...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module">
    import { initAdminUI } from '/lib/ui.js';
    import { supabase } from '/lib/supabase.js';

    await initAdminUI();

    const alertBox = document.getElementById('adminAlert');

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    function formatMoney(value) {
      return `$${Number(value || 0).toFixed(2)}`;
    }

    function statusBadge(status) {
      return `<span class="status-badge status-${status}">${status}</span>`;
    }

    function getRequestDetails(r) {
  if (r.type === 'deposit') {
    const depositorName =
      r.depositor_name ||
      r.destination_details?.depositor_name ||
      '-';

    return `
      Method: ${escapeHtml(r.payment_method || '-')}<br>
      Name on deposit: ${escapeHtml(depositorName)}
    `;
  }

  const d = r.destination_details || {};

  return `
    Method: ${escapeHtml(d.payment_method || r.payment_method || '-')}<br>
    Account: ${escapeHtml(d.account_name || '-')}<br>
    Number/Wallet: ${escapeHtml(d.account_number || '-')}
  `;
    }

    window.loadRequests = async function() {
      hideAlert();

      const type = document.getElementById('typeFilter').value;
      const status = document.getElementById('statusFilter').value;
      const body = document.getElementById('requestsBody');

      body.innerHTML = '<tr><td colspan="7" class="loading-text">Loading requests...</td></tr>';

      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error('Not authenticated.');

        const res = await fetch(`/api/admin?action=requests&type=${type}&status=${status}`, {
          headers: {
            'Authorization': `Bearer ${session.access_token}`
          }
        });

        const result = await res.json();

        if (!res.ok) {
          throw new Error(result.error || 'Failed to load requests.');
        }

        const requests = result.requests || [];

        if (requests.length === 0) {
          body.innerHTML = '<tr><td colspan="7" class="empty-text">No requests found.</td></tr>';
          return;
        }

        body.innerHTML = requests.map(r => {
          const actionHtml = r.status === 'pending'
            ? `
              <div class="request-actions">
                <button class="btn btn-success" onclick="handleRequest('${r.id}', 'approve')">Approve</button>
                <button class="btn btn-warning" onclick="handleRequest('${r.id}', 'reject')">Reject</button>
              </div>
            `
            : `<span style="color: var(--text-muted);">Processed</span>`;

          const amountClass = r.type === 'deposit' ? 'credit' : 'debit';
          const sign = r.type === 'deposit' ? '+' : '-';

          return `
            <tr>
              <td>${new Date(r.created_at).toLocaleString()}</td>
              <td>
                <strong>${r.profiles?.full_name || 'User'}</strong><br>
                <small style="color: var(--text-muted);">${r.profiles?.email || ''}</small>
              </td>
              <td style="text-transform: capitalize;">${r.type}</td>
              <td class="${amountClass}" style="font-weight: 800;">
                ${sign}${formatMoney(r.amount)}
              </td>
              <td style="font-size: 0.9rem;">${getRequestDetails(r)}</td>
              <td>${statusBadge(r.status)}</td>
              <td>${actionHtml}</td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        body.innerHTML = `<tr><td colspan="7" style="color: var(--danger);">${err.message}</td></tr>`;
      }
    };

    window.handleRequest = async function(requestId, decision) {
      hideAlert();

      const note = prompt(`Optional admin note for ${decision}:`);

      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error('Not authenticated.');

        const action = decision === 'approve'
          ? 'approve_financial_request'
          : 'reject_financial_request';

        const res = await fetch('/api/admin', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify({
            action,
            request_id: requestId,
            admin_note: note || ''
          })
        });

        const result = await res.json();

        if (!res.ok) {
          throw new Error(result.error || `Failed to ${decision} request.`);
        }

        showAlert(`Request ${decision}d successfully.`, 'success');
        await loadRequests();
      } catch (err) {
        showAlert(err.message);
      }
    };

    await loadRequests();
  </script>
</body>
</html>
