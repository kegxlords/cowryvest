<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Manage Stocks | Cowryvest</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="container page-container">
    <div class="page-hero">
      <div>
        <h1>Manage Stocks</h1>
        <p>Update share prices. Users buy and convert at these prices.</p>
      </div>
      <span class="chip frozen">Market Control</span>
    </div>

    <nav class="admin-subnav">
      <a href="/admin/index.html">Overview</a>
      <a href="/admin/stocks.html" class="active">Stocks</a>
      <a href="/admin/promoters.html">Promoters</a>
      <a href="/admin/requests.html">Requests</a>
    </nav>

    <div id="adminAlert" class="alert error"></div>

    <section class="section-card" style="margin-bottom: 16px;">
      <div class="section-head">
        <h2>Add New Stock</h2>
      </div>

      <form id="createStockForm">
        <div class="admin-toolbar">
          <div class="form-group">
            <label for="companyName">Company Name</label>
            <input type="text" id="companyName" class="form-control" placeholder="e.g. Apple Inc." required />
          </div>

          <div class="form-group">
            <label for="stockSymbol">Symbol</label>
            <input type="text" id="stockSymbol" class="form-control" placeholder="AAPL" />
          </div>

          <div class="form-group">
            <label for="stockPrice">Starting Price</label>
            <input type="number" id="stockPrice" class="form-control" min="0" step="0.01" required />
          </div>

          <button type="submit" class="btn btn-primary" id="createStockBtn">Add Stock</button>
        </div>
      </form>
    </section>

    <section class="section-card">
      <div class="section-head">
        <h2>Current Stocks</h2>
        <button class="btn btn-secondary" id="reloadBtn">Refresh</button>
      </div>

      <div class="admin-table-wrap">
        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Company</th>
                <th>Current Price</th>
                <th>New Price</th>
                <th>Last Updated</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="stocksBody">
              <tr>
                <td colspan="5" class="empty-text">Loading stocks...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module">
    import { initAdminUI } from '/lib/ui.js';
    import { supabase } from '/lib/supabase.js';
    import { formatMoney } from '/lib/format.js';

    await initAdminUI();

    const alertBox = document.getElementById('adminAlert');
    const createForm = document.getElementById('createStockForm');
    const createBtn = document.getElementById('createStockBtn');

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getLogoText(stock) {
      return (stock.symbol || stock.company_name || '?')
        .slice(0, 2)
        .toUpperCase();
    }

    async function apiGet(action) {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) throw new Error('Not authenticated.');

      const res = await fetch(`/api/admin?action=${action}`, {
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });

      const result = await res.json();
      if (!res.ok) throw new Error(result.error || 'Request failed.');
      return result;
    }

    async function apiPost(payload) {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) throw new Error('Not authenticated.');

      const res = await fetch('/api/admin', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify(payload)
      });

      const result = await res.json();
      if (!res.ok) throw new Error(result.error || 'Request failed.');
      return result;
    }

    async function loadStocks() {
      const body = document.getElementById('stocksBody');
      body.innerHTML = '<tr><td colspan="5" class="empty-text">Loading stocks...</td></tr>';

      try {
        const result = await apiGet('stocks');
        const stocks = result.stocks || [];

        if (stocks.length === 0) {
          body.innerHTML = '<tr><td colspan="5" class="empty-text">No stocks listed yet.</td></tr>';
          return;
        }

        body.innerHTML = stocks.map(stock => `
          <tr>
            <td>
              <div style="display: flex; align-items: center; gap: 10px;">
                <div class="stock-logo" style="width: 38px; height: 38px; border-radius: 11px; font-size: .8rem;">
                  ${escapeHtml(getLogoText(stock))}
                </div>
                <div>
                  <strong>${escapeHtml(stock.company_name)}</strong><br />
                  <span class="stock-symbol-chip">${escapeHtml(stock.symbol || 'N/A')}</span>
                </div>
              </div>
            </td>
            <td><strong>${formatMoney(stock.current_price)}</strong></td>
            <td>
              <input
                type="number"
                class="form-control price-input"
                data-stock-id="${stock.id}"
                min="0"
                step="0.01"
                value="${Number(stock.current_price).toFixed(2)}"
              />
            </td>
            <td style="color: var(--text-muted); font-size: .85rem;">
              ${stock.updated_at ? new Date(stock.updated_at).toLocaleString() : '-'}
            </td>
            <td>
              <button class="btn btn-primary" data-update="${stock.id}">Update</button>
            </td>
          </tr>
        `).join('');

        document.querySelectorAll('[data-update]').forEach(btn => {
          btn.addEventListener('click', () => updatePrice(btn.dataset.update, btn));
        });
      } catch (err) {
        body.innerHTML = `<tr><td colspan="5" style="color: var(--danger);">${escapeHtml(err.message)}</td></tr>`;
      }
    }

    async function updatePrice(stockId, btn) {
      hideAlert();

      const input = document.querySelector(`input[data-stock-id="${stockId}"]`);
      const newPrice = Number.parseFloat(input.value);

      if (!Number.isFinite(newPrice) || newPrice < 0) {
        showAlert('Enter a valid price.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        await apiPost({
          action: 'update_price',
          stock_id: stockId,
          new_price: newPrice
        });

        showAlert('Price updated successfully.', 'success');
        await loadStocks();
      } catch (err) {
        showAlert(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Update';
      }
    }

    createForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const company_name = document.getElementById('companyName').value.trim();
      const symbol = document.getElementById('stockSymbol').value.trim().toUpperCase();
      const current_price = Number.parseFloat(document.getElementById('stockPrice').value);

      if (!company_name) {
        showAlert('Company name is required.');
        return;
      }

      if (!Number.isFinite(current_price) || current_price < 0) {
        showAlert('Enter a valid starting price.');
        return;
      }

      createBtn.disabled = true;
      createBtn.textContent = 'Adding...';

      try {
        await apiPost({
          action: 'create_stock',
          company_name,
          symbol,
          current_price
        });

        showAlert('Stock created successfully.', 'success');
        createForm.reset();
        await loadStocks();
      } catch (err) {
        showAlert(err.message);
      } finally {
        createBtn.disabled = false;
        createBtn.textContent = 'Add Stock';
      }
    });

    document.getElementById('reloadBtn').addEventListener('click', loadStocks);

    await loadStocks();
  </script>
</body>
</html>
