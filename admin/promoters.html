<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Credit Promoters | Cowryvest</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="container page-container">
    <div class="page-hero">
      <div>
        <h1>Promoter Frozen Balance</h1>
        <p>Credit frozen balance. It can only be invested and returns to frozen on conversion.</p>
      </div>
      <span class="chip frozen">Promoter Tools</span>
    </div>

    <nav class="admin-subnav">
      <a href="/admin/index.html">Overview</a>
      <a href="/admin/stocks.html">Stocks</a>
      <a href="/admin/promoters.html" class="active">Promoters</a>
      <a href="/admin/requests.html">Requests</a>
    </nav>

    <div id="adminAlert" class="alert error"></div>

    <div class="deposit-layout">
      <section class="section-card">
        <div class="section-head">
          <h2>Find User</h2>
        </div>

        <div class="admin-toolbar">
          <div class="form-group">
            <label for="searchQuery">Name, Email, or Referral Code</label>
            <input type="text" id="searchQuery" class="form-control" placeholder="Search user..." />
          </div>
          <button class="btn btn-primary" id="searchBtn">Search</button>
        </div>

        <div id="userResults" class="user-search-results"></div>
      </section>

      <section class="section-card">
        <div class="section-head">
          <h2>Credit Frozen Balance</h2>
        </div>

        <div id="selectedUserBox" class="selected-user-box">
          Selected: <strong id="selectedUserName">-</strong><br />
          <span id="selectedUserEmail">-</span>
        </div>

        <form id="creditForm">
          <div class="form-group">
            <label for="creditAmount">Amount</label>
            <input type="number" id="creditAmount" class="form-control" min="0.01" step="0.01" required />
          </div>

          <div class="form-group">
            <label for="creditNote">Note</label>
            <input type="text" id="creditNote" class="form-control" placeholder="e.g. Weekly promoter bonus" />
          </div>

          <button type="submit" class="btn btn-dark w-full" id="creditBtn">
            Credit Frozen Balance
          </button>
        </form>
      </section>
    </div>

    <section class="section-card">
      <div class="section-head">
        <h2>Recent Frozen Credits</h2>
        <button class="btn btn-secondary" id="reloadCredits">Refresh</button>
      </div>

      <div id="creditsList" class="mini-list">
        <div class="mini-empty">Loading...</div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module">
    import { initAdminUI } from '/lib/ui.js';
    import { supabase } from '/lib/supabase.js';
    import { formatMoney } from '/lib/format.js';

    await initAdminUI();

    let selectedUser = null;

    const alertBox = document.getElementById('adminAlert');
    const selectedUserBox = document.getElementById('selectedUserBox');
    const creditForm = document.getElementById('creditForm');
    const creditBtn = document.getElementById('creditBtn');

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getInitials(name) {
      return String(name || 'U')
        .trim()
        .split(' ')
        .map(p => p[0])
        .slice(0, 2)
        .join('')
        .toUpperCase();
    }

    async function apiGet(action) {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) throw new Error('Not authenticated.');

      const res = await fetch(`/api/admin?action=${action}`, {
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });

      const result = await res.json();
      if (!res.ok) throw new Error(result.error || 'Request failed.');
      return result;
    }

    async function apiPost(payload) {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) throw new Error('Not authenticated.');

      const res = await fetch('/api/admin', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify(payload)
      });

      const result = await res.json();
      if (!res.ok) throw new Error(result.error || 'Request failed.');
      return result;
    }

    async function searchUsers() {
      hideAlert();

      const q = document.getElementById('searchQuery').value.trim();
      const resultsBox = document.getElementById('userResults');
      resultsBox.innerHTML = '<div class="loading-text">Searching...</div>';

      try {
        const result = await apiGet(`users&q=${encodeURIComponent(q)}`);
        const users = result.users || [];

        if (users.length === 0) {
          resultsBox.innerHTML = '<div class="empty-text">No users found.</div>';
          return;
        }

        resultsBox.innerHTML = users.map(user => `
          <div class="user-result ${selectedUser?.id === user.id ? 'selected' : ''}" data-user-id="${user.id}">
            <div style="display: flex; align-items: center; gap: 12px; min-width: 0;">
              <div class="hist-icon" style="background: #eef2ff; color: #4f46e5;">
                <span style="font-weight: 900; font-size: .8rem;">${escapeHtml(getInitials(user.full_name))}</span>
              </div>
              <div style="min-width: 0;">
                <div class="name">${escapeHtml(user.full_name || 'Unnamed user')}</div>
                <div class="meta">${escapeHtml(user.email)}</div>
                <div class="meta">
                  Ref: ${escapeHtml(user.referral_code)} •
                  Main: ${formatMoney(user.main_balance)} •
                  Frozen: ${formatMoney(user.frozen_balance)}
                </div>
              </div>
            </div>

            <button class="btn btn-primary" data-select="${user.id}">Select</button>
          </div>
        `).join('');

        // Re-attach select handlers with fresh user objects
        document.querySelectorAll('[data-select]').forEach(btn => {
          btn.addEventListener('click', () => {
            const user = users.find(u => u.id === btn.dataset.select);
            selectUser(user);
          });
        });
      } catch (err) {
        resultsBox.innerHTML = `<div style="color: var(--danger);">${escapeHtml(err.message)}</div>`;
      }
    }

    function selectUser(user) {
      selectedUser = user;

      document.getElementById('selectedUserName').textContent = user.full_name || 'Unnamed user';
      document.getElementById('selectedUserEmail').textContent = user.email;
      selectedUserBox.classList.add('active');

      document.querySelectorAll('.user-result').forEach(el => {
        el.classList.toggle('selected', el.dataset.userId === user.id);
      });
    }

    creditForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      if (!selectedUser) {
        showAlert('Select a user first.');
        return;
      }

      const amount = Number.parseFloat(document.getElementById('creditAmount').value);
      const note = document.getElementById('creditNote').value.trim();

      if (!Number.isFinite(amount) || amount <= 0) {
        showAlert('Enter a valid credit amount.');
        return;
      }

      creditBtn.disabled = true;
      creditBtn.textContent = 'Crediting...';

      try {
        await apiPost({
          action: 'credit_frozen',
          target_user_id: selectedUser.id,
          credit_amount: amount,
          note
        });

        showAlert('Frozen balance credited successfully.', 'success');
        creditForm.reset();
        await loadRecentCredits();
        await searchUsers();
      } catch (err) {
        showAlert(err.message);
      } finally {
        creditBtn.disabled = false;
        creditBtn.textContent = 'Credit Frozen Balance';
      }
    });

    async function loadRecentCredits() {
      const list = document.getElementById('creditsList');
      list.innerHTML = '<div class="mini-empty">Loading...</div>';

      try {
        const result = await apiGet('frozen_credits');
        const credits = result.credits || [];

        if (credits.length === 0) {
          list.innerHTML = '<div class="mini-empty">No frozen credits yet.</div>';
          return;
        }

        list.innerHTML = credits.map(c => `
          <div class="mini-item">
            <div class="hist-icon" style="background: #eef2ff; color: #4f46e5;">
              <span style="font-weight: 900; font-size: .8rem;">
                ${escapeHtml(getInitials(c.profiles?.full_name))}
              </span>
            </div>
            <div style="flex: 1; min-width: 0;">
              <div class="title">${escapeHtml(c.profiles?.full_name || 'User')}</div>
              <div class="meta">
                ${escapeHtml(c.profiles?.email || '')} •
                ${escapeHtml(c.description || 'No note')} •
                ${new Date(c.created_at).toLocaleString()}
              </div>
            </div>
            <div class="amount credit">+${formatMoney(c.amount)}</div>
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = `<div class="mini-empty">${escapeHtml(err.message)}</div>`;
      }
    }

    document.getElementById('searchBtn').addEventListener('click', searchUsers);

    document.getElementById('searchQuery').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        searchUsers();
      }
    });

    document.getElementById('reloadCredits').addEventListener('click', loadRecentCredits);

    await loadRecentCredits();
  </script>
</body>
            </html>
