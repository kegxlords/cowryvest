<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Withdraw | Cowryvest</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="container page-container">
    <div class="page-hero">
      <div>
        <h1>Withdraw Funds</h1>
        <p>Withdrawals are paid from your Main Balance after admin approval.</p>
      </div>
    </div>

    <section class="withdraw-hero">
      <span class="label">Available Main Balance</span>
      <div class="value" id="mainBalance">₦0.00</div>

      <div class="quick-amounts">
        <button type="button" class="quick-amt" data-percent="25">25%</button>
        <button type="button" class="quick-amt" data-percent="50">50%</button>
        <button type="button" class="quick-amt" data-percent="75">75%</button>
        <button type="button" class="quick-amt" data-percent="100">Max</button>
      </div>
    </section>

    <div class="deposit-layout">
      <section class="section-card">
        <div class="section-head">
          <h2>Withdrawal Request</h2>
        </div>

        <div id="withdrawAlert" class="alert error"></div>

        <form id="withdrawForm">
          <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" class="form-control" min="1" step="0.01" required />
          </div>

          <div class="form-group">
            <label for="paymentMethod">Payout Method</label>
            <select id="paymentMethod" class="form-control" required>
              <option value="bank_transfer">Bank Transfer</option>
              <option value="usdt_trc20">USDT TRC20</option>
              <option value="usdt_erc20">USDT ERC20</option>
            </select>
          </div>

          <div class="form-group">
            <label for="accountName">Account Name</label>
            <input type="text" id="accountName" class="form-control" required />
          </div>

          <div class="form-group">
            <label for="accountNumber">Account Number / Wallet Address</label>
            <input type="text" id="accountNumber" class="form-control" required />
          </div>

          <div class="form-group">
            <label for="bankName">Bank Name / Network</label>
            <input type="text" id="bankName" class="form-control" placeholder="e.g. GTBank / TRON" />
          </div>

          <button type="submit" class="btn btn-primary w-full" id="withdrawBtn">
            Submit Withdrawal Request
          </button>
        </form>
      </section>

      <section class="section-card">
        <div class="section-head">
          <h2>Recent Withdrawals</h2>
        </div>
        <div id="withdrawRequests" class="mini-list">
          <div class="mini-empty">Loading...</div>
        </div>
      </section>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module">
    import { initUI } from '/lib/ui.js';
    import { supabase } from '/lib/supabase.js';
    import { formatMoney } from '/lib/format.js';

    await initUI();

    let mainBalance = 0;

    const alertBox = document.getElementById('withdrawAlert');
    const form = document.getElementById('withdrawForm');
    const submitBtn = document.getElementById('withdrawBtn');
    const amountInput = document.getElementById('amount');

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function statusBadge(status) {
      return `<span class="status-badge status-${status}">${status}</span>`;
    }

    async function loadProfile() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;

      const { data: profile } = await supabase
        .from('profiles')
        .select('main_balance')
        .eq('id', user.id)
        .single();

      mainBalance = Number(profile?.main_balance || 0);
      document.getElementById('mainBalance').textContent = formatMoney(mainBalance);
    }

    async function loadRequests() {
      const container = document.getElementById('withdrawRequests');
      container.innerHTML = '<div class="mini-empty">Loading...</div>';

      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;

      const { data: requests, error } = await supabase
        .from('financial_requests')
        .select('*')
        .eq('user_id', user.id)
        .eq('type', 'withdrawal')
        .order('created_at', { ascending: false })
        .limit(10);

      if (error) {
        container.innerHTML = `<div class="mini-empty">${escapeHtml(error.message)}</div>`;
        return;
      }

      if (!requests || requests.length === 0) {
        container.innerHTML = '<div class="mini-empty">No withdrawal requests yet.</div>';
        return;
      }

      container.innerHTML = requests.map(r => {
        const d = r.destination_details || {};

        return `
          <div class="mini-item">
            <div>
              <div class="title">Withdrawal • ${escapeHtml(d.account_name || '-')}</div>
              <div class="meta">
                ${escapeHtml(d.account_number || '-')} • ${new Date(r.created_at).toLocaleString()}
              </div>
            </div>
            <div style="text-align:right;">
              <div class="amount debit">-${formatMoney(r.amount)}</div>
              <div style="margin-top:6px;">${statusBadge(r.status)}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.querySelectorAll('.quick-amt').forEach(btn => {
      btn.addEventListener('click', () => {
        const percent = Number(btn.dataset.percent) / 100;
        const value = Math.floor(mainBalance * percent * 100) / 100;
        amountInput.value = value > 0 ? value : '';
        hideAlert();
      });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const amount = Number.parseFloat(amountInput.value);
      const payment_method = document.getElementById('paymentMethod').value;
      const account_name = document.getElementById('accountName').value.trim();
      const account_number = document.getElementById('accountNumber').value.trim();
      const bank_name = document.getElementById('bankName').value.trim();

      if (!Number.isFinite(amount) || amount <= 0) {
        showAlert('Enter a valid withdrawal amount.');
        return;
      }

      if (amount > mainBalance) {
        showAlert('Amount exceeds available Main Balance.');
        return;
      }

      if (!account_name || !account_number) {
        showAlert('Account name and account number are required.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error('Not authenticated.');

        const res = await fetch('/api/finance', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify({
            action: 'withdraw_request',
            amount,
            destination_details: {
              payment_method,
              account_name,
              account_number,
              bank_name
            }
          })
        });

        const result = await res.json();

        if (!res.ok) {
          throw new Error(result.error || 'Failed to submit withdrawal request.');
        }

        showAlert('Withdrawal request submitted for approval.', 'success');
        form.reset();
        await loadProfile();
        await loadRequests();
      } catch (err) {
        showAlert(err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Withdrawal Request';
      }
    });

    await loadProfile();
    await loadRequests();
  </script>
</body>
</html>
