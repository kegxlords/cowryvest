<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Profile | Cowryvest</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="container page-container">

    <section class="profile-hero-v2">
      <div id="avatarContainer">
        <div class="avatar-initials">C</div>
      </div>

      <div class="profile-hero-info">
        <h1 id="profileName">Loading...</h1>
        <p id="profileEmail">-</p>

        <div class="profile-hero-chips">
          <span id="chipRole">User</span>
          <span id="chipMember">Member</span>
          <span id="chipRef">Ref: ---</span>
        </div>
      </div>

      <div class="profile-hero-actions">
        <a href="/settings.html" class="btn btn-light">Edit Profile</a>
        <a href="/referral.html" class="hero-btn ghost" style="flex: 0; padding: 10px 16px; border-radius: 12px;">Referrals</a>
      </div>
    </section>

    <section class="stat-grid dash-stats">
      <div class="stat-card premium green">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path>
            <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path>
            <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path>
          </svg>
        </div>
        <div>
          <h3>Main Balance</h3>
          <div class="value credit" id="mainBalance">₦0.00</div>
        </div>
      </div>

      <div class="stat-card premium indigo">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <div>
          <h3>Frozen Balance</h3>
          <div class="value" id="frozenBalance">₦0.00</div>
        </div>
      </div>

      <div class="stat-card premium blue">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v18h18"></path>
            <path d="m7 13 3-3 4 4 5-6"></path>
          </svg>
        </div>
        <div>
          <h3>Portfolio Value</h3>
          <div class="value" id="portfolioValue">₦0.00</div>
        </div>
      </div>

      <div class="stat-card premium amber">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="7" width="18" height="13" rx="2"></rect>
            <path d="M8 7V5h8v2"></path>
          </svg>
        </div>
        <div>
          <h3>Total Invested</h3>
          <div class="value" id="totalInvested">₦0.00</div>
        </div>
      </div>
    </section>

    <div class="deposit-layout">
      <section class="section-card">
        <div class="section-head">
          <h2>Account Details</h2>
        </div>

        <div class="detail-list">
          <div class="detail-row">
            <span class="label">Full Name</span>
            <span class="value" id="detailName">-</span>
          </div>

          <div class="detail-row">
            <span class="label">Email</span>
            <span class="value" id="detailEmail">-</span>
          </div>

          <div class="detail-row">
            <span class="label">Phone</span>
            <span class="value" id="detailPhone">Not set</span>
          </div>

          <div class="detail-row">
            <span class="label">Referral Code</span>
            <span class="value">
              <span id="detailRef">---</span>
              <button class="copy-btn" id="copyRefBtn">Copy</button>
            </span>
          </div>

          <div class="detail-row">
            <span class="label">Security</span>
            <span class="value">
              <a href="/settings.html" style="color: var(--primary); font-weight: 800; text-decoration: none;">
                Change Password
              </a>
            </span>
          </div>
        </div>
      </section>

      <section class="section-card">
        <div class="section-head">
          <h2>Recent Activity</h2>
          <a href="/transaction-history.html">View all</a>
        </div>

        <div id="activityList" class="mini-list">
          <div class="mini-empty">Loading...</div>
        </div>
      </section>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module">
    import { initUI } from '/lib/ui.js';
    import { supabase } from '/lib/supabase.js';
    import { formatMoney } from '/lib/format.js';

    await initUI();

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getInitials(name) {
      return String(name || 'C')
        .trim()
        .split(' ')
        .map(p => p[0])
        .slice(0, 2)
        .join('')
        .toUpperCase();
    }

    async function loadProfile() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;

      const res = await fetch('/api/user?action=profile', {
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });

      const result = await res.json();
      if (!res.ok) return;

      const p = result.profile || {};

      // Hero
      document.getElementById('profileName').textContent = p.full_name || 'Investor';
      document.getElementById('profileEmail').textContent = p.email || '-';
      document.getElementById('chipRole').textContent =
        p.role === 'admin' ? 'Admin' : 'Investor';
      document.getElementById('chipRef').textContent = `Ref: ${p.referral_code || '---'}`;

      if (p.created_at) {
        document.getElementById('chipMember').textContent =
          `Member since ${new Date(p.created_at).toLocaleDateString('en-NG', { month: 'short', year: 'numeric' })}`;
      }

      const avatarBox = document.getElementById('avatarContainer');
      if (p.avatar_url) {
        avatarBox.innerHTML = `<img src="${escapeHtml(p.avatar_url)}" alt="Avatar" class="avatar" />`;
      } else {
        avatarBox.innerHTML = `<div class="avatar-initials">${escapeHtml(getInitials(p.full_name))}</div>`;
      }

      // Balances
      document.getElementById('mainBalance').textContent = formatMoney(p.main_balance);
      document.getElementById('frozenBalance').textContent = formatMoney(p.frozen_balance);

      // Details
      document.getElementById('detailName').textContent = p.full_name || '-';
      document.getElementById('detailEmail').textContent = p.email || '-';
      document.getElementById('detailPhone').textContent = p.phone || 'Not set';
      document.getElementById('detailRef').textContent = p.referral_code || '---';
    }

    async function loadPortfolio() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;

      const { data: holdings } = await supabase
        .from('user_stocks')
        .select('quantity, total_initial_invested, stocks (current_price)')
        .eq('user_id', user.id);

      let current = 0;
      let invested = 0;

      (holdings || []).forEach(h => {
        current += h.quantity * Number(h.stocks?.current_price || 0);
        invested += Number(h.total_initial_invested || 0);
      });

      document.getElementById('portfolioValue').textContent = formatMoney(current);
      document.getElementById('totalInvested').textContent = formatMoney(invested);
    }

    async function loadActivity() {
      const list = document.getElementById('activityList');

      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;

      const res = await fetch('/api/user?action=history', {
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });

      const result = await res.json();
      if (!res.ok) {
        list.innerHTML = '<div class="mini-empty">Failed to load activity.</div>';
        return;
      }

      const recent = (result.history || []).slice(0, 6);

      if (recent.length === 0) {
        list.innerHTML = '<div class="mini-empty">No activity yet.</div>';
        return;
      }

      list.innerHTML = recent.map(item => {
        const sign = item.direction === 'credit' ? '+' : '-';
        const amountClass = item.direction === 'credit' ? 'credit' : 'debit';

        return `
          <div class="mini-item">
            <div style="flex: 1; min-width: 0;">
              <div class="title">${escapeHtml(item.label)}</div>
              <div class="meta">${new Date(item.created_at).toLocaleString()}</div>
            </div>
            <div class="amount ${amountClass}">${sign}${formatMoney(item.amount)}</div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('copyRefBtn').addEventListener('click', async () => {
      const code = document.getElementById('detailRef').textContent;
      if (!code || code === '---') return;

      try {
        await navigator.clipboard.writeText(code);
        document.getElementById('copyRefBtn').textContent = 'Copied!';
      } catch {
        alert(code);
      }
      setTimeout(() => (document.getElementById('copyRefBtn').textContent = 'Copy'), 1500);
    });

    await loadProfile();
    await loadPortfolio();
    await loadActivity();
  </script>
</body>
</html>
