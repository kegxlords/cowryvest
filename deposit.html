<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Deposit | Cowryvest</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="container" style="margin-top: 30px;">
    <div class="page-header">
      <div>
        <h1>Deposit Funds</h1>
        <p>Submit a deposit request. Admin will approve it and credit your Main Balance.</p>
      </div>
      <div class="balance-pill">
        Main Balance: <span id="mainBalance">$0.00</span>
      </div>
    </div>

    <div class="form-card">
      <div id="depositAlert" class="alert error"></div>

      <form id="depositForm">
        <div class="form-row">
          <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" class="form-control" min="1" step="0.01" required />
          </div>

          <div class="form-group">
            <label for="paymentMethod">Payment Method</label>
            <select id="paymentMethod" class="form-control" required>
              <option value="bank_transfer">Bank Transfer</option>
              <option value="usdt_trc20">USDT TRC20</option>
              <option value="usdt_erc20">USDT ERC20</option>
              <option value="bitcoin">Bitcoin</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="reference">Transaction Reference / Note</label>
          <input type="text" id="reference" class="form-control" placeholder="e.g. GTB-8837261" />
          <div class="input-hint">Optional but helpful for faster approval.</div>
        </div>

        <button type="submit" class="btn btn-primary" id="depositBtn">
          Submit Deposit Request
        </button>
      </form>
    </div>

    <h2 style="margin-top: 30px; margin-bottom: 8px;">Recent Deposit Requests</h2>
    <div id="depositRequests" class="request-list">
      <p>Loading...</p>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module">
    import { initUI } from '/lib/ui.js';
    import { supabase } from '/lib/supabase.js';

    await initUI();

    const alertBox = document.getElementById('depositAlert');
    const form = document.getElementById('depositForm');
    const submitBtn = document.getElementById('depositBtn');

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    function formatMoney(value) {
      return `$${Number(value || 0).toFixed(2)}`;
    }

    function statusBadge(status) {
      return `<span class="status-badge status-${status}">${status}</span>`;
    }

    async function loadProfile() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;

      const { data: profile } = await supabase
        .from('profiles')
        .select('main_balance')
        .eq('id', user.id)
        .single();

      document.getElementById('mainBalance').textContent = formatMoney(profile?.main_balance);
    }

    async function loadRequests() {
      const container = document.getElementById('depositRequests');
      container.innerHTML = '<p>Loading...</p>';

      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;

      const { data: requests, error } = await supabase
        .from('financial_requests')
        .select('*')
        .eq('user_id', user.id)
        .eq('type', 'deposit')
        .order('created_at', { ascending: false })
        .limit(20);

      if (error) {
        container.innerHTML = `<p style="color: var(--danger);">Error loading requests: ${error.message}</p>`;
        return;
      }

      if (!requests || requests.length === 0) {
        container.innerHTML = '<div class="empty-state">No deposit requests yet.</div>';
        return;
      }

      container.innerHTML = requests.map(r => `
        <div class="request-item">
          <div class="left">
            <div class="title">Deposit Request</div>
            <div class="meta">
              ${r.payment_method || 'Payment method'} • ${new Date(r.created_at).toLocaleString()}
            </div>
            ${r.reference ? `<div class="meta">Ref: ${r.reference}</div>` : ''}
          </div>

          <div style="text-align: right;">
            <div class="amount credit">+${formatMoney(r.amount)}</div>
            <div style="margin-top: 8px;">${statusBadge(r.status)}</div>
          </div>
        </div>
      `).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const amount = Number.parseFloat(document.getElementById('amount').value);
      const payment_method = document.getElementById('paymentMethod').value;
      const reference = document.getElementById('reference').value.trim();

      if (!Number.isFinite(amount) || amount <= 0) {
        showAlert('Enter a valid deposit amount.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error('Not authenticated.');

        const res = await fetch('/api/finance', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify({
            action: 'deposit_request',
            amount,
            payment_method,
            reference
          })
        });

        const result = await res.json();

        if (!res.ok) {
          throw new Error(result.error || 'Failed to submit deposit request.');
        }

        showAlert('Deposit request submitted successfully.', 'success');
        form.reset();
        await loadRequests();
      } catch (err) {
        showAlert(err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Deposit Request';
      }
    });

    await loadProfile();
    await loadRequests();
  </script>
</body>
</html>
