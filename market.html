<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Market | Cowryvest</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="container page-container">
    <div class="page-hero">
      <div>
        <h1>Stock Market</h1>
        <p>Buy shares at today's price. Lock-in days equal shares purchased.</p>
      </div>
      <div class="hero-chips">
        <span class="chip main">Main: <span id="mainChip">₦0.00</span></span>
        <span class="chip frozen">Frozen: <span id="frozenChip">₦0.00</span></span>
      </div>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </svg>
      <input type="text" id="searchInput" placeholder="Search company or symbol..." />
    </div>

    <div id="marketGrid" class="stock-grid">
      <div class="mini-empty">Loading stocks...</div>
    </div>
  </main>

  <!-- Buy Modal -->
  <div class="modal-overlay" id="buyModal">
    <div class="modal">
      <h2 id="buyStockName">Buy Stock</h2>

      <div class="warning-box" id="lockInWarning"></div>

      <div class="form-group">
        <label>Quantity</label>
        <div class="stepper">
          <button type="button" id="qtyMinus">−</button>
          <input type="number" id="quantityInput" class="form-control" min="1" value="1" />
          <button type="button" id="qtyPlus">+</button>
        </div>
      </div>

      <div class="form-group">
        <label>Payment Source</label>
        <div class="source-cards">
          <label class="source-card active" id="sourceMainCard">
            <input type="radio" name="purchase_source" value="main" checked />
            <span>
              <span class="src-label">Main Balance</span><br />
              <span class="src-bal" id="mainSourceBal">₦0.00</span>
            </span>
          </label>

          <label class="source-card" id="sourceFrozenCard">
            <input type="radio" name="purchase_source" value="frozen" />
            <span>
              <span class="src-label">Frozen Balance</span><br />
              <span class="src-bal" id="frozenSourceBal">₦0.00</span>
            </span>
          </label>
        </div>
      </div>

      <div class="summary-box">
        <div class="summary-row">
          <span>Current Price</span>
          <strong id="summaryPrice">₦0.00</strong>
        </div>
        <div class="summary-row">
          <span>Quantity</span>
          <strong id="summaryQty">1</strong>
        </div>
        <div class="summary-row">
          <span>Total Cost</span>
          <strong id="summaryTotal">₦0.00</strong>
        </div>
        <div class="summary-row">
          <span>Lock-In Added</span>
          <strong id="summaryAddedDays">1 day</strong>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelBuyBtn">Cancel</button>
        <button class="btn btn-primary" id="confirmBuyBtn">Confirm Buy</button>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script type="module">
    import { initUI } from '/lib/ui.js';
    import { supabase } from '/lib/supabase.js';
    import { formatMoney } from '/lib/format.js';

    await initUI();

    let profile = null;
    let stocks = [];
    let holdingsMap = {};
    let selectedStock = null;

    const grid = document.getElementById('marketGrid');
    const searchInput = document.getElementById('searchInput');

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getLogoText(stock) {
      return (stock.symbol || stock.company_name || '?')
        .slice(0, 2)
        .toUpperCase();
    }

    /* ---------- Loaders ---------- */

    async function loadProfile() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;

      const { data } = await supabase
        .from('profiles')
        .select('main_balance, frozen_balance')
        .eq('id', user.id)
        .single();

      profile = data;

      document.getElementById('mainChip').textContent = formatMoney(profile?.main_balance);
      document.getElementById('frozenChip').textContent = formatMoney(profile?.frozen_balance);
      document.getElementById('mainSourceBal').textContent = formatMoney(profile?.main_balance);
      document.getElementById('frozenSourceBal').textContent = formatMoney(profile?.frozen_balance);
    }

    async function loadHoldings() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;

      const { data: holdings } = await supabase
        .from('user_stocks')
        .select('stock_id, quantity, lock_in_days')
        .eq('user_id', user.id);

      holdingsMap = {};

      (holdings || []).forEach(h => {
        if (!holdingsMap[h.stock_id]) {
          holdingsMap[h.stock_id] = { quantity: 0, lock: 0 };
        }
        holdingsMap[h.stock_id].quantity += h.quantity;
        holdingsMap[h.stock_id].lock = Math.max(holdingsMap[h.stock_id].lock, h.lock_in_days);
      });
    }

    async function loadStocks() {
      const { data, error } = await supabase
        .from('stocks')
        .select('id, company_name, symbol, current_price, updated_at')
        .order('company_name', { ascending: true });

      if (error) {
        grid.innerHTML = `<div class="mini-empty">${escapeHtml(error.message)}</div>`;
        return;
      }

      stocks = data || [];
      renderGrid();
    }

    function renderGrid() {
      const query = searchInput.value.trim().toLowerCase();

      const filtered = stocks.filter(s =>
        !query ||
        s.company_name.toLowerCase().includes(query) ||
        (s.symbol || '').toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="mini-empty">No stocks match your search.</div>';
        return;
      }

      grid.innerHTML = filtered.map(stock => {
        const holding = holdingsMap[stock.id];

        const holdingBadge = holding
          ? `<div class="stock-holding">
               You own ${holding.quantity} share${holding.quantity === 1 ? '' : 's'}
               ${holding.lock > 0 ? `• ${holding.lock}d lock` : '• Unlocked'}
             </div>`
          : '';

        return `
          <div class="stock-card premium">
            <div class="stock-top">
              <div class="stock-logo">${escapeHtml(getLogoText(stock))}</div>
              <span class="stock-symbol-chip">${escapeHtml(stock.symbol || 'N/A')}</span>
            </div>

            <h3>${escapeHtml(stock.company_name)}</h3>
            <div class="stock-price">${formatMoney(stock.current_price)}</div>
            <div class="stock-meta">
              Updated ${stock.updated_at ? new Date(stock.updated_at).toLocaleString() : '-'}
            </div>

            ${holdingBadge}

            <button class="btn btn-primary w-full" data-buy="${stock.id}">
              Buy Shares
            </button>
          </div>
        `;
      }).join('');

      document.querySelectorAll('[data-buy]').forEach(btn => {
        btn.addEventListener('click', () => openBuyModal(btn.dataset.buy));
      });
    }

    searchInput.addEventListener('input', renderGrid);

    /* ---------- Buy modal ---------- */

    function getSelectedSource() {
      return document.querySelector('input[name="purchase_source"]:checked').value;
    }

    function getQuantity() {
      const value = parseInt(document.getElementById('quantityInput').value, 10);
      return isNaN(value) || value < 1 ? 1 : value;
    }

    async function openBuyModal(stockId) {
      selectedStock = stocks.find(s => s.id === stockId);
      if (!selectedStock) return;

      document.getElementById('buyStockName').textContent = `Buy ${selectedStock.company_name}`;
      document.getElementById('quantityInput').value = 1;
      document.querySelector('input[name="purchase_source"][value="main"]').checked = true;
      updateSourceCards();
      updateBuySummary();
      await updateLockWarning();

      document.getElementById('buyModal').classList.add('active');
    }

    function closeBuyModal() {
      document.getElementById('buyModal').classList.remove('active');
      selectedStock = null;
    }

    function updateSourceCards() {
      const source = getSelectedSource();
      document.getElementById('sourceMainCard').classList.toggle('active', source === 'main');
      document.getElementById('sourceFrozenCard').classList.toggle('active', source === 'frozen');
    }

    function updateBuySummary() {
      if (!selectedStock) return;

      const qty = getQuantity();
      const total = Number(selectedStock.current_price) * qty;

      document.getElementById('summaryPrice').textContent = formatMoney(selectedStock.current_price);
      document.getElementById('summaryQty').textContent = qty;
      document.getElementById('summaryTotal').textContent = formatMoney(total);
      document.getElementById('summaryAddedDays').textContent = `${qty} day${qty > 1 ? 's' : ''}`;

      const source = getSelectedSource();
      const balance = Number(
        source === 'frozen' ? profile?.frozen_balance : profile?.main_balance
      );

      const btn = document.getElementById('confirmBuyBtn');

      if (total > balance) {
        btn.disabled = true;
        btn.textContent = 'Insufficient Balance';
      } else {
        btn.disabled = false;
        btn.textContent = 'Confirm Buy';
      }
    }

    async function updateLockWarning() {
      if (!selectedStock) return;

      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;

      const source = getSelectedSource();
      const qty = getQuantity();

      const { data: existing } = await supabase
        .from('user_stocks')
        .select('quantity, lock_in_days')
        .eq('user_id', user.id)
        .eq('stock_id', selectedStock.id)
        .eq('purchase_source', source)
        .maybeSingle();

      const currentQty = existing?.quantity || 0;
      const currentLock = existing?.lock_in_days || 0;
      const box = document.getElementById('lockInWarning');

      if (currentQty > 0) {
        box.innerHTML = `
          You already own <strong>${currentQty}</strong> shares with
          <strong>${source === 'frozen' ? 'Frozen' : 'Main'} Balance</strong>.<br />
          Current lock-in: <strong>${currentLock} day(s)</strong>.
          Buying <strong>${qty}</strong> more raises total lock-in to
          <strong>${currentLock + qty} day(s)</strong>.
        `;
      } else {
        box.innerHTML = `
          Buying <strong>${qty}</strong> share(s) creates a lock-in of
          <strong>${qty} day(s)</strong> before conversion is allowed.
        `;
      }
    }

    document.getElementById('qtyMinus').addEventListener('click', () => {
      const input = document.getElementById('quantityInput');
      input.value = Math.max(1, getQuantity() - 1);
      updateBuySummary();
      updateLockWarning();
    });

    document.getElementById('qtyPlus').addEventListener('click', () => {
      const input = document.getElementById('quantityInput');
      input.value = getQuantity() + 1;
      updateBuySummary();
      updateLockWarning();
    });

    document.getElementById('quantityInput').addEventListener('input', () => {
      updateBuySummary();
      updateLockWarning();
    });

    document.querySelectorAll('input[name="purchase_source"]').forEach(radio => {
      radio.addEventListener('change', () => {
        updateSourceCards();
        updateBuySummary();
        updateLockWarning();
      });
    });

    document.getElementById('cancelBuyBtn').addEventListener('click', closeBuyModal);

    document.getElementById('buyModal').addEventListener('click', (e) => {
      if (e.target.id === 'buyModal') closeBuyModal();
    });

    document.getElementById('confirmBuyBtn').addEventListener('click', async () => {
      if (!selectedStock) return;

      const btn = document.getElementById('confirmBuyBtn');
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error('Not authenticated.');

        const res = await fetch('/api/wealth', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify({
            action: 'buy',
            stock_id: selectedStock.id,
            quantity: getQuantity(),
            purchase_source: getSelectedSource()
          })
        });

        const result = await res.json();

        if (!res.ok) {
          throw new Error(result.error || 'Purchase failed.');
        }

        closeBuyModal();
        await loadProfile();
        await loadHoldings();
        renderGrid();
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Confirm Buy';
      }
    });

    /* ---------- Init ---------- */

    await loadProfile();
    await loadHoldings();
    await loadStocks();
  </script>
</body>
</html>
