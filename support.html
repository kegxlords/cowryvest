<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Support | Cowryvest</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="container" style="margin-top: 30px;">
    <div class="page-header">
      <div>
        <h1>Support Center</h1>
        <p>Create a ticket and track responses from the Cowryvest team.</p>
      </div>
    </div>

    <div id="supportAlert" class="alert error"></div>

    <div class="support-layout">
      <aside>
        <section class="section-card" style="margin-bottom: 20px;">
          <h2>New Ticket</h2>

          <form id="ticketForm">
            <div class="form-group">
              <label for="subject">Subject</label>
              <input type="text" id="subject" class="form-control" required />
            </div>

            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" class="form-control" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary" id="createTicketBtn">
              Create Ticket
            </button>
          </form>
        </section>

        <section class="section-card">
          <h2>Your Tickets</h2>
          <div id="ticketList" class="ticket-list">
            <div class="loading-text">Loading tickets...</div>
          </div>
        </section>
      </aside>

      <section class="ticket-detail" id="ticketDetail">
        <div class="empty-state">
          Select a ticket to view the conversation.
        </div>
      </section>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module">
    import { initUI } from '/lib/ui.js';
    import { supabase } from '/lib/supabase.js';

    await initUI();

    let activeTicketId = null;

    const alertBox = document.getElementById('supportAlert');
    const ticketForm = document.getElementById('ticketForm');
    const createTicketBtn = document.getElementById('createTicketBtn');
    const ticketList = document.getElementById('ticketList');
    const ticketDetail = document.getElementById('ticketDetail');

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    function statusBadge(status) {
      const map = {
        open: 'status-pending',
        answered: 'status-approved',
        closed: 'status-rejected'
      };

      return `<span class="status-badge ${map[status] || 'status-pending'}">${status}</span>`;
    }

    async function loadTickets() {
      ticketList.innerHTML = '<div class="loading-text">Loading tickets...</div>';

      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error('Not authenticated.');

        const res = await fetch('/api/support?action=tickets', {
          headers: {
            'Authorization': `Bearer ${session.access_token}`
          }
        });

        const result = await res.json();

        if (!res.ok) {
          throw new Error(result.error || 'Failed to load tickets.');
        }

        const tickets = result.tickets || [];

        if (tickets.length === 0) {
          ticketList.innerHTML = '<div class="empty-text">No tickets yet.</div>';
          ticketDetail.innerHTML = '<div class="empty-state">Select a ticket to view the conversation.</div>';
          return;
        }

        ticketList.innerHTML = tickets.map(ticket => `
          <div class="ticket-item ${ticket.id === activeTicketId ? 'active' : ''}" data-ticket-id="${ticket.id}">
            <div class="subject">${escapeHtml(ticket.subject)}</div>
            <div class="meta">
              ${statusBadge(ticket.status)}
              <div style="margin-top: 8px;">
                ${ticket.last_message ? escapeHtml(ticket.last_message.slice(0, 80)) : 'No message'}
              </div>
              <div style="margin-top: 6px;">
                ${new Date(ticket.updated_at).toLocaleString()}
              </div>
            </div>
          </div>
        `).join('');

        document.querySelectorAll('.ticket-item').forEach(item => {
          item.addEventListener('click', () => {
            openTicket(item.dataset.ticketId);
          });
        });
      } catch (err) {
        ticketList.innerHTML = `<div style="color: var(--danger);">${err.message}</div>`;
      }
    }

    async function openTicket(ticketId) {
      hideAlert();
      activeTicketId = ticketId;

      ticketDetail.innerHTML = '<div class="loading-text">Loading conversation...</div>';

      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error('Not authenticated.');

        const res = await fetch(`/api/support?action=messages&ticket_id=${ticketId}`, {
          headers: {
            'Authorization': `Bearer ${session.access_token}`
          }
        });

        const result = await res.json();

        if (!res.ok) {
          throw new Error(result.error || 'Failed to load ticket.');
        }

        const ticket = result.ticket;
        const messages = result.messages || [];

        ticketDetail.innerHTML = `
          <div class="ticket-detail-header">
            <div>
              <h2>${escapeHtml(ticket.subject)}</h2>
              <div class="meta" style="color: var(--text-muted); margin-top: 6px;">
                Created ${new Date(ticket.created_at).toLocaleString()}
              </div>
            </div>
            <div>${statusBadge(ticket.status)}</div>
          </div>

          <div class="message-thread" id="messageThread">
            ${messages.map(renderMessage).join('')}
          </div>

          <div class="reply-box">
            <form id="replyForm">
              <div class="form-group">
                <label for="replyMessage">Reply</label>
                <textarea id="replyMessage" class="form-control" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary" id="sendReplyBtn">Send Reply</button>
            </form>
          </div>
        `;

        const thread = document.getElementById('messageThread');
        thread.scrollTop = thread.scrollHeight;

        document.getElementById('replyForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          await sendReply(ticketId);
        });

        await loadTickets();
      } catch (err) {
        ticketDetail.innerHTML = `<div style="color: var(--danger);">${err.message}</div>`;
      }
    }

    function renderMessage(message) {
      const senderClass = message.sender_type === 'user' ? 'user' : 'admin';
      const label = message.sender_type === 'user' ? 'You' : 'Support';

      return `
        <div class="message-bubble ${senderClass}">
          <strong>${label}</strong><br>
          ${escapeHtml(message.message)}
          <span class="message-time">${new Date(message.created_at).toLocaleString()}</span>
        </div>
      `;
    }

    async function sendReply(ticketId) {
      const textarea = document.getElementById('replyMessage');
      const button = document.getElementById('sendReplyBtn');
      const message = textarea.value.trim();

      if (!message) {
        showAlert('Reply message is required.');
        return;
      }

      button.disabled = true;
      button.textContent = 'Sending...';

      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error('Not authenticated.');

        const res = await fetch('/api/support', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify({
            action: 'reply',
            ticket_id: ticketId,
            message
          })
        });

        const result = await res.json();

        if (!res.ok) {
          throw new Error(result.error || 'Failed to send reply.');
        }

        textarea.value = '';
        await openTicket(ticketId);
      } catch (err) {
        showAlert(err.message);
      } finally {
        button.disabled = false;
        button.textContent = 'Send Reply';
      }
    }

    ticketForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const subject = document.getElementById('subject').value.trim();
      const message = document.getElementById('message').value.trim();

      if (!subject || !message) {
        showAlert('Subject and message are required.');
        return;
      }

      createTicketBtn.disabled = true;
      createTicketBtn.textContent = 'Creating...';

      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error('Not authenticated.');

        const res = await fetch('/api/support', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify({
            action: 'create_ticket',
            subject,
            message
          })
        });

        const result = await res.json();

        if (!res.ok) {
          throw new Error(result.error || 'Failed to create ticket.');
        }

        showAlert('Support ticket created.', 'success');
        ticketForm.reset();
        activeTicketId = result.ticket.id;
        await loadTickets();
        await openTicket(result.ticket.id);
      } catch (err) {
        showAlert(err.message);
      } finally {
        createTicketBtn.disabled = false;
        createTicketBtn.textContent = 'Create Ticket';
      }
    });

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    await loadTickets();
  </script>
</body>
</html>
