<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>My Investments | Cowryvest</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="container page-container">
    <div class="page-hero">
      <div>
        <h1>My Investments</h1>
        <p>Track holdings, lock-ins, and convert when unlocked.</p>
      </div>
      <button class="btn btn-secondary" id="refreshBtn">Refresh</button>
    </div>

    <section class="stat-grid dash-stats">
      <div class="stat-card premium blue">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="7" width="18" height="13" rx="2"></rect>
            <path d="M8 7V5h8v2"></path>
          </svg>
        </div>
        <div>
          <h3>Total Invested</h3>
          <div class="value" id="totalInvested">₦0.00</div>
        </div>
      </div>

      <div class="stat-card premium indigo">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v18h18"></path>
            <path d="m7 13 3-3 4 4 5-6"></path>
          </svg>
        </div>
        <div>
          <h3>Current Value</h3>
          <div class="value" id="totalValue">₦0.00</div>
        </div>
      </div>

      <div class="stat-card premium green">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"></path>
          </svg>
        </div>
        <div>
          <h3>Profit / Loss</h3>
          <div class="value" id="totalPL">₦0.00</div>
        </div>
      </div>

      <div class="stat-card premium amber">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 7v5l3 3"></path>
          </svg>
        </div>
        <div>
          <h3>Positions</h3>
          <div class="value" id="totalPositions">0</div>
        </div>
      </div>
    </section>

    <div id="holdingsGrid" class="holdings-grid">
      <div class="mini-empty">Loading holdings...</div>
    </div>
  </main>

  <!-- Convert Modal -->
  <div class="modal-overlay" id="sellModal">
    <div class="modal">
      <h2>Convert Shares</h2>

      <div class="warning-box" id="sellWarning"></div>

      <div class="summary-box">
        <div class="summary-row">
          <span>Company</span>
          <strong id="sellCompany">-</strong>
        </div>
        <div class="summary-row">
          <span>Quantity</span>
          <strong id="sellQty">0</strong>
        </div>
        <div class="summary-row">
          <span>Current Price</span>
          <strong id="sellPrice">₦0.00</strong>
        </div>
        <div class="summary-row">
          <span>Estimated Payout</span>
          <strong id="sellPayout">₦0.00</strong>
        </div>
        <div class="summary-row">
          <span>Payout To</span>
          <strong id="sellDestination">Main Balance</strong>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelSellBtn">Cancel</button>
        <button class="btn btn-primary" id="confirmSellBtn">Confirm Convert</button>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script type="module">
    import { initUI } from '/lib/ui.js';
    import { supabase } from '/lib/supabase.js';
    import { formatMoney } from '/lib/format.js';

    await initUI();

    let holdings = [];
    let selectedHolding = null;

    const grid = document.getElementById('holdingsGrid');

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getLogoText(h) {
      return (h.stocks?.symbol || h.stocks?.company_name || '?')
        .slice(0, 2)
        .toUpperCase();
    }

    function unlockDate(lockDays) {
      const d = new Date();
      d.setDate(d.getDate() + lockDays);
      return d.toLocaleDateString('en-NG', { day: 'numeric', month: 'short' });
    }

    // API read (service role) — also fires the guarded daily self-heal
    async function apiGet(url) {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) throw new Error('Not authenticated.');

      const res = await fetch(url, {
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });

      const result = await res.json();
      if (!res.ok) throw new Error(result.error || 'Request failed.');
      return result;
    }

    async function loadHoldings() {
      grid.innerHTML = '<div class="mini-empty">Loading holdings...</div>';

      try {
        const result = await apiGet('/api/wealth?action=holdings');
        holdings = result.holdings || [];
        renderSummary();
        renderGrid();
      } catch (err) {
        grid.innerHTML = `<div class="mini-empty">${escapeHtml(err.message)}</div>`;
      }
    }

    function renderSummary() {
      let invested = 0;
      let current = 0;

      holdings.forEach(h => {
        invested += Number(h.total_initial_invested || 0);
        current += h.quantity * Number(h.stocks?.current_price || 0);
      });

      const pl = current - invested;

      document.getElementById('totalInvested').textContent = formatMoney(invested);
      document.getElementById('totalValue').textContent = formatMoney(current);

      const plEl = document.getElementById('totalPL');
      plEl.textContent = `${pl >= 0 ? '+' : ''}${formatMoney(pl)}`;
      plEl.style.color = pl >= 0 ? 'var(--success)' : 'var(--danger)';

      document.getElementById('totalPositions').textContent = holdings.length;
    }

    function renderGrid() {
      if (holdings.length === 0) {
        grid.innerHTML = `
          <div class="mini-empty">
            No active holdings yet.<br />
            <a href="/market.html">Go to Market</a>
          </div>
        `;
        return;
      }

      grid.innerHTML = holdings.map(h => {
        const price = Number(h.stocks?.current_price || 0);
        const currentValue = h.quantity * price;
        const pl = currentValue - Number(h.total_initial_invested || 0);
        const locked = h.lock_in_days > 0;

        const sourceBadge = h.purchase_source === 'frozen'
          ? '<span class="badge badge-frozen">Frozen</span>'
          : '<span class="badge badge-main">Main</span>';

        const lockBadge = locked
          ? `<span class="badge badge-locked">${h.lock_in_days}d lock</span>`
          : '<span class="badge badge-unlocked">Unlocked</span>';

        const plClass = pl >= 0 ? 'text-success' : 'text-danger';

        return `
          <div class="holding-card">
            <div class="holding-head">
              <div class="stock-logo">${escapeHtml(getLogoText(h))}</div>
              <div>
                <div class="holding-name">
                  ${escapeHtml(h.stocks?.company_name || 'Unknown')}
                  <span class="sym">${escapeHtml(h.stocks?.symbol || '')}</span>
                </div>
                <div class="holding-badges">${sourceBadge}${lockBadge}</div>
              </div>
              <div class="holding-value">
                <div class="v">${formatMoney(currentValue)}</div>
                <div class="l">Current value</div>
              </div>
            </div>

            <div class="holding-stats">
              <div class="hstat">
                <div class="l">Shares</div>
                <div class="v">${h.quantity}</div>
              </div>
              <div class="hstat">
                <div class="l">Invested</div>
                <div class="v">${formatMoney(h.total_initial_invested)}</div>
              </div>
              <div class="hstat">
                <div class="l">Price</div>
                <div class="v">${formatMoney(price)}</div>
              </div>
              <div class="hstat">
                <div class="l">P / L</div>
                <div class="v ${plClass}">${pl >= 0 ? '+' : ''}${formatMoney(pl)}</div>
              </div>
            </div>

            <div class="holding-foot">
              <div class="unlock-info ${locked ? 'locked' : 'free'}">
                ${locked
                  ? `Unlocks in ${h.lock_in_days} day${h.lock_in_days === 1 ? '' : 's'} • ~${unlockDate(h.lock_in_days)}`
                  : 'Ready to convert'}
              </div>

              <button
                class="btn ${locked ? 'btn-secondary' : 'btn-primary'}"
                data-sell="${h.id}"
                ${locked ? 'disabled' : ''}
              >
                ${locked ? 'Locked' : 'Convert'}
              </button>
            </div>
          </div>
        `;
      }).join('');

      document.querySelectorAll('[data-sell]').forEach(btn => {
        btn.addEventListener('click', () => openSellModal(btn.dataset.sell));
      });
    }

    /* ---------- Convert modal ---------- */

    function openSellModal(holdingId) {
      selectedHolding = holdings.find(h => h.id === holdingId);
      if (!selectedHolding) return;

      const price = Number(selectedHolding.stocks?.current_price || 0);
      const payout = selectedHolding.quantity * price;
      const destination = selectedHolding.purchase_source === 'frozen'
        ? 'Frozen Balance'
        : 'Main Balance';

      document.getElementById('sellCompany').textContent =
        selectedHolding.stocks?.company_name || 'Unknown';
      document.getElementById('sellQty').textContent = selectedHolding.quantity;
      document.getElementById('sellPrice').textContent = formatMoney(price);
      document.getElementById('sellPayout').textContent = formatMoney(payout);
      document.getElementById('sellDestination').textContent = destination;

      document.getElementById('sellWarning').innerHTML = `
        Converting <strong>${selectedHolding.quantity}</strong> share(s) of
        <strong>${escapeHtml(selectedHolding.stocks?.company_name || 'stock')}</strong>.<br />
        Payout returns to your <strong>${destination}</strong>.
      `;

      document.getElementById('sellModal').classList.add('active');
    }

    function closeSellModal() {
      document.getElementById('sellModal').classList.remove('active');
      selectedHolding = null;
    }

    document.getElementById('cancelSellBtn').addEventListener('click', closeSellModal);

    document.getElementById('sellModal').addEventListener('click', (e) => {
      if (e.target.id === 'sellModal') closeSellModal();
    });

    document.getElementById('confirmSellBtn').addEventListener('click', async () => {
      if (!selectedHolding) return;

      const btn = document.getElementById('confirmSellBtn');
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error('Not authenticated.');

        const res = await fetch('/api/wealth', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify({
            action: 'sell',
            user_stock_id: selectedHolding.id
          })
        });

        const result = await res.json();

        if (!res.ok) {
          throw new Error(result.error || 'Conversion failed.');
        }

        closeSellModal();
        await loadHoldings();
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Confirm Convert';
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', loadHoldings);

    await loadHoldings();
  </script>
</body>
</html>
